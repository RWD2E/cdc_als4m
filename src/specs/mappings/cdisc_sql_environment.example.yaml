# Maps logical model.entity names to physical database objects.
objects:
  PCORNET_CDM.DEMOGRAPHIC: RAW.PCORNET.DEMOGRAPHIC
  PCORNET_CDM.DEATH: RAW.PCORNET.DEATH
  PCORNET_CDM.ENCOUNTER: RAW.PCORNET.ENCOUNTER
  PCORNET_CDM.DIAGNOSIS: RAW.PCORNET.DIAGNOSIS
  PCORNET_CDM.CONDITION: RAW.PCORNET.CONDITION
  ALS_SDTM_STAGING.SUBJECT_COHORT: WORK.ALS.SUBJECT_COHORT
  ALS_SDTM_STAGING.SUBJECT_TIMELINE: WORK.ALS.SUBJECT_TIMELINE
  ALS_SDTM_STAGING.ENCOUNTER_VISIT_ASSIGNMENT: WORK.ALS.ENCOUNTER_VISIT_ASSIGNMENT
  ALS_SDTM.DM: ANALYTICS.SDTM.DM
  ALS_SDTM.SV: ANALYTICS.SDTM.SV

# Join predicates are positional after the first source/bridge relation.
# For DM the relation order is: src DEMOGRAPHIC, dth DEATH, coh SUBJECT_COHORT, tl SUBJECT_TIMELINE.
joins:
  PCORNET_DEMOGRAPHIC_TO_DM:
    - "src.PATID = dth.PATID"
    - "src.PATID = coh.PATID"
    - "src.PATID = tl.PATID"
  PCORNET_ENCOUNTER_TO_SV:
    - "src.ENCOUNTERID = eva.ENCOUNTERID AND src.PATID = eva.PATID"
    - "src.PATID = coh.PATID"
    - "src.PATID = tl.PATID"

# Optional map-level filters.
filters:
  PCORNET_DEMOGRAPHIC_TO_DM: "coh.IN_COHORT = 1"
  PCORNET_ENCOUNTER_TO_SV: "eva.VISIT IS NOT NULL"

# SQL relations containing loaded value-set maps. Keys may be filename or stem.
value_sets:
  PCORNET_SEX_TO_SDTM_SEX.csv: REFERENCE.CDISC.PCORNET_SEX_TO_SDTM_SEX
  PCORNET_RACE_TO_SDTM_RACE.csv: REFERENCE.CDISC.PCORNET_RACE_TO_SDTM_RACE
  PCORNET_HISPANIC_TO_SDTM_ETHNIC.csv: REFERENCE.CDISC.PCORNET_HISPANIC_TO_SDTM_ETHNIC

parameters:
  STUDYID: ALS-NH-001
